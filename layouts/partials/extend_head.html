<script>
  (function () {
    function loadNotoFonts() {
      var preconnectGoogle = document.createElement('link');
      preconnectGoogle.rel = 'preconnect';
      preconnectGoogle.href = 'https://fonts.googleapis.com';
      document.head.appendChild(preconnectGoogle);

      var preconnectStatic = document.createElement('link');
      preconnectStatic.rel = 'preconnect';
      preconnectStatic.href = 'https://fonts.gstatic.com';
      preconnectStatic.crossOrigin = 'anonymous';
      document.head.appendChild(preconnectStatic);

      var noto = document.createElement('link');
      noto.rel = 'stylesheet';
      noto.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap';
      document.head.appendChild(noto);
    }

    document.documentElement.dataset.region = 'cn';
    fetch('/cdn-cgi/trace', { cache: 'no-store' })
      .then(function (response) { return response.text(); })
      .then(function (text) {
        var match = text.match(/^loc=(.+)$/m);
        var region = match && match[1] === 'CN' ? 'cn' : 'intl';
        document.documentElement.dataset.region = region;
        if (region === 'intl') {
          loadNotoFonts();
        }
      })
      .catch(function () {});
  })();
</script>
