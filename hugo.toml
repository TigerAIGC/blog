baseURL = 'https://www.aildm.com/'
locale = 'zh-CN'
title = 'AI与数字营销'
theme = 'PaperMod'

defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true
enableRobotsTXT = true

[sitemap]
  changeFreq = 'weekly'
  priority = 0.7
  filename = 'sitemap.xml'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[taxonomies]
  category = 'categories'
  tag = 'tags'

[pagination]
  pagerSize = 10

[related]
  threshold = 60
  includeNewer = true
  toLower = true

  [[related.indices]]
    name = 'tags'
    weight = 100

  [[related.indices]]
    name = 'categories'
    weight = 80

  [[related.indices]]
    name = 'keywords'
    weight = 60

  [[related.indices]]
    name = 'date'
    weight = 10

[params]
  env = 'production'
  description = 'AI与数字营销是一个面向零基础用户的知识博客，分享 AIGC 内容创作、AI 漫剧、AI 智能体与工作流、AI 编程、SEO/GEO、互联网营销运营、网络配置和实用工具教程。'
  keywords = ['AI与数字营销', 'AIGC', 'AI漫剧', 'AI智能体', 'AI工作流', 'AI编程', 'SEO', 'GEO', '数字营销', '互联网运营', '网络配置', 'AI工具教程']
  author = 'TigerAIGC'
  defaultTheme = 'light'
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = true
  disableSpecial1stPost = true
  ShowShareButtons = true
  ShowRssButtonInSectionTermList = true
  comments = true

  [params.cover]
    responsiveImages = false
    linkFullImages = true

  [params.utterances]
    repo = 'TigerAIGC/blog'
    issueTerm = 'pathname'
    label = 'comment'
    theme = 'github-light'

  [params.adsense]
    enabled = true
    client = 'ca-pub-2580913634697099'
    autoAds = true
    inArticleSlot = ''
    displaySlot = ''

  [params.relatedPosts]
    enabled = true
    count = 4

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = '文章'
    url = '/posts/'
    weight = 10

  [[menu.main]]
    identifier = 'categories'
    name = '分类'
    url = '/categories/'
    weight = 20

  [[menu.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 30

  [[menu.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 40

  [[menu.main]]
    identifier = 'search'
    name = '搜索'
    url = '/search/'
    weight = 50
