backend:
  name: github
  repo: TigerAIGC/blog
  branch: main
  base_url: https://auth.aildm.com
  auth_endpoint: /auth

locale: zh_Hans

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "content/posts"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    editor:
      preview: false
    fields:
      - label: "标题"
        name: "title"
        widget: "string"
      - label: "发布日期"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
      - label: "草稿"
        name: "draft"
        widget: "boolean"
        default: false
      - label: "SEO 描述"
        name: "description"
        widget: "text"
        required: false
      - label: "分类"
        name: "categories"
        widget: "list"
        required: false
      - label: "标签"
        name: "tags"
        widget: "list"
        required: false
      - label: "封面图"
        name: "cover"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - label: "图片"
            name: "image"
            widget: "image"
            required: false
          - label: "替代文本"
            name: "alt"
            widget: "string"
            required: false
          - label: "说明文字"
            name: "caption"
            widget: "string"
            required: false
          - label: "相对路径"
            name: "relative"
            widget: "boolean"
            default: false
            required: false
      - label: "正文"
        name: "body"
        widget: "markdown"
